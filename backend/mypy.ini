[mypy]
# No repo-wide strictness change: CI's blocking "Lint / Format / Typecheck"
# gate (.github/workflows/ci.yml) only ever passed `registry/ eventbus/
# permissions/ audit_trail/ proof_engine/ storage/ observability/` as
# targets — this file does not add or remove any target, it only controls
# what mypy does when a target imports a module OUTSIDE that scoped set.

# registry/routes.py (P1, 2026-08-31: the Registry instance store) imports
# frek_v1.auth.get_current_client and identity_engine.service for its
# write-authority check. mypy's default follow_imports="normal" then
# type-checks those modules' full bodies too and reports THEIR pre-existing
# `db: Optional[...]` errors (identity_engine/routes.py, frek_v1/auth.py)
# as if they were registry/'s own — modules that were never part of the
# blocking gate's scope and were green before this import existed. "silent"
# keeps their inferred types (so a real signature mismatch in registry/'s
# own call sites still gets caught) without re-surfacing their own
# pre-existing, out-of-scope errors here.
[mypy-frek_v1.*]
follow_imports = silent

[mypy-identity_engine.*]
follow_imports = silent
