[pytest]
asyncio_mode = auto

# Phase 2 test infrastructure (see reports/10_TEST_INFRASTRUCTURE.md).
#
# `unit`        — no external services required (no live backend, no MongoDB).
#                 Tests are marked `unit` explicitly via `pytestmark` at the top
#                 of their module; every other test is auto-marked `integration`
#                 by conftest.py's pytest_collection_modifyitems.
# `integration` — requires a live backend process on TEST_BACKEND_URL
#                 (default http://localhost:8001) plus a reachable MongoDB
#                 (MONGO_URL/DB_NAME). Run explicitly with `-m integration`
#                 once that infrastructure is up.
#
# Canonical commands (see reports/10_TEST_INFRASTRUCTURE.md for the full
# reproduction transcript):
#   pytest                    -> runs only `unit` tests (default; no infra needed)
#   pytest -m integration     -> runs the live-server suite (requires infra)
#   pytest -m ""              -> runs everything, unfiltered
markers =
    unit: fast, no external services required (no live backend, no MongoDB)
    integration: requires a live backend process (TEST_BACKEND_URL) + MongoDB
    real_mongo: requires a real MongoDB URI (MONGO_URI) -- run explicitly via
        `pytest -m real_mongo`; auto-marked `integration` too (conftest.py's
        pytest_collection_modifyitems, since it isn't `unit`) so it is already
        excluded from the default `-m "not integration"` run. Skips cleanly at
        collection time when MONGO_URI is unset -- see
        tests/test_real_mongo_validation.py's own docstring.

# --ignore=tests/test_ecosystem.py: this is the ONE test module in the whole
# suite that fails at *collection* time (ModuleNotFoundError, not a test
# failure) in any environment without access to the private PyPI package
# `emergentintegrations` (backend/requirements.txt:26, imported transitively
# via server.py -> services/webhook.py:8). It is not published on public
# PyPI (verified: `pip install emergentintegrations==0.1.0` fails with "No
# matching distribution found" both here and on a standard GitHub Actions
# runner). This is deliberately NOT hidden by a broad exception or a fake
# pass — it is excluded explicitly, by name, with this paper trail, and
# tracked as a P0 remediation item in reports/10_TEST_INFRASTRUCTURE.md and
# reports/07_DEPLOYMENT_REPORT.md. Every other module in tests/ collects
# cleanly (verified: 356 - 1 = 355 items collected with this ignore active).
addopts = -m "not integration" --ignore=tests/test_ecosystem.py
