name: FREKCORE CI

# Phase 2 (see reports/10_TEST_INFRASTRUCTURE.md and reports/12_PHASE2_IMPLEMENTATION.md
# for the evidence backing every design choice below). This pipeline does NOT
# depend on a real MongoDB for its blocking jobs — the `unit` test tier
# (backend/pytest.ini) is explicitly built to need neither MongoDB nor a live
# backend process. Two jobs are intentionally non-blocking
# (`continue-on-error: true`), each with an inline comment explaining exactly
# why, per the "document why, never simulate success" rule.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  # ---------------------------------------------------------------------
  # Blocking: lint + format-check + typecheck, scoped to the 7 modules this
  # phase owns end-to-end: backend/registry/, backend/eventbus/,
  # backend/permissions/, backend/audit_trail/, backend/proof_engine/,
  # backend/storage/, backend/observability/ (+ their test files, see the
  # $MODULES / $TEST_FILES env below). The rest of the
  # informational `lint-full-repo` job below) that predate Phase 1/2 and
  # are out of this phase's scope to fix — see reports/10_TEST_INFRASTRUCTURE.md.
  # ---------------------------------------------------------------------
  lint-format-typecheck:
    name: Lint / Format / Typecheck (this phase's modules)
    runs-on: ubuntu-latest
    env:
      MODULES: registry/ eventbus/ permissions/ audit_trail/ proof_engine/ storage/ observability/
      TEST_FILES: >-
        tests/test_registry.py tests/test_eventbus.py tests/test_permissions.py
        tests/test_audit_trail.py tests/test_proof_engine.py tests/test_storage.py
        tests/test_observability.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CI dependency set
        run: pip install -r requirements-ci.txt
      - name: flake8
        run: flake8 --max-line-length=120 $MODULES $TEST_FILES
      - name: black --check
        run: black --check $MODULES $TEST_FILES
      - name: mypy
        run: mypy --ignore-missing-imports $MODULES

  # ---------------------------------------------------------------------
  # Informational only: flake8 across the whole backend/. Never blocks the
  # pipeline — it exists so lint regressions in touched files are visible
  # in the CI log without requiring this phase to fix ~1100 pre-existing
  # findings across 30 unrelated modules (reproduced 2026-08-30: `flake8
  # --max-line-length=120 --count backend/` -> 1121).
  # ---------------------------------------------------------------------
  lint-full-repo-informational:
    name: Lint (whole backend, informational — not a merge gate)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CI dependency set
        run: pip install -r requirements-ci.txt
      - name: flake8 (whole backend, non-blocking)
        run: flake8 --max-line-length=120 --count .

  # ---------------------------------------------------------------------
  # Blocking: the canonical `unit` test command. No MongoDB, no live
  # backend process — see backend/pytest.ini and backend/tests/conftest.py
  # for how `unit` vs `integration` is decided, and reports/10 for the
  # full reproduction. `--ignore=tests/test_ecosystem.py` is baked into
  # pytest.ini's addopts (documented there), not hidden here.
  # ---------------------------------------------------------------------
  unit-tests:
    name: Unit tests + coverage (this phase's modules)
    runs-on: ubuntu-latest
    env:
      # backend/passport/keys.py defaults FREK_PASSPORT_KEY_PATH to
      # /app/backend/.passport_key.pem — a real production convention
      # (this whole app is deployed rooted at /app), not a bug to change
      # there. GitHub Actions runners have no /app and no permission to
      # create it (PermissionError: [Errno 13], found via PR #1's first
      # CI run on this branch after the requirements-ci.txt fix — see
      # reports/16_INTEGRATION_TEST_BASELINE.md §8). Point it at the
      # runner's own writable temp dir instead, CI-only. A literal /tmp
      # path (not ${{ runner.temp }}: GitHub's parser rejects the `runner`
      # context at job-level `env:` — "Unrecognized named-value: 'runner'",
      # confirmed via workflow_dispatch's own validation error) — /tmp is
      # always writable on GitHub-hosted Linux runners.
      FREK_PASSPORT_KEY_PATH: /tmp/frekcore_ci_passport_key.pem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CI dependency set
        run: pip install -r requirements-ci.txt
      - name: "pytest (canonical command: `pytest`, unit tier only by default)"
        run: pytest -v
      - name: Coverage (registry, eventbus, permissions, audit_trail, proof_engine, storage, observability)
        run: >-
          pytest --cov=registry --cov=eventbus --cov=permissions --cov=audit_trail
          --cov=proof_engine --cov=storage --cov=observability
          --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml

  # ---------------------------------------------------------------------
  # Dependency / security scan. Runs against requirements-ci.txt (the
  # resolvable subset), NOT the full backend/requirements.txt, because the
  # latter cannot be resolved by pip at all on a clean environment — see
  # requirements-ci.txt's header comment and reports/10_TEST_INFRASTRUCTURE.md
  # for the exact two reproduced blockers (private `emergentintegrations`
  # package + a cryptography/webauthn version conflict). Findings are
  # real (see reports/11_SECURITY_PHASE2.md) but pre-existing/pinned, not
  # introduced by this phase — kept non-blocking until a dependency-upgrade
  # decision is made by a human, per this phase's non-goals.
  # ---------------------------------------------------------------------
  dependency-audit:
    name: Dependency vulnerability scan (pip-audit, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: pip-audit against the resolvable CI dependency set
        run: pip-audit -r requirements-ci.txt

  # ---------------------------------------------------------------------
  # SDKs (Priority 7, extended STATE_7 2026-09-03 to Registry + Identity
  # (read) + the D1-D5 capability clients) — see
  # sdk/python/frekcore_sdk/__init__.py, sdk/typescript/src/index.ts, and
  # docs/architecture/FREKCORE_SDK_CONTRACT_V1.md for scope. The Python
  # SDK test is a real end-to-end test against each capability's actual
  # FastAPI router (TestClient, no live server); the TypeScript SDK test
  # mocks fetch (no ASGI-transport equivalent in TS — see
  # sdk/typescript/README.md).
  # ---------------------------------------------------------------------
  sdk-python:
    name: Python SDK — real end-to-end test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CI dependency set + SDK
        run: |
          pip install -r backend/requirements-ci.txt
          pip install -e sdk/python
      - name: pytest (real end-to-end against each capability's own router)
        run: PYTHONPATH=backend:sdk/python python3 -m pytest sdk/python/tests -v

  sdk-typescript:
    name: TypeScript SDK — typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  # ---------------------------------------------------------------------
  # Docker build. EXPECTED TO FAIL on a public runner today: the Dockerfile
  # runs `pip install -r backend/requirements.txt` inside the image, and
  # that file requires the private, non-PyPI `emergentintegrations` package
  # (backend/requirements.txt:26, real dependency of
  # backend/services/webhook.py:8 — not dead code). This is not simulated
  # as green: the step genuinely runs and is expected to show red/failed;
  # `continue-on-error` only stops that from blocking unrelated jobs.
  # Remediation (not applied by this phase, needs a human decision): either
  # (a) provide a private package index as a repository secret, or
  # (b) vendor/replace emergentintegrations, or
  # (c) make the Stripe-checkout import optional/lazy like the existing
  # notary.service fallback pattern in backend/frek_v1/stages.py:10-14.
  # See reports/07_DEPLOYMENT_REPORT.md and reports/12_PHASE2_IMPLEMENTATION.md.
  # ---------------------------------------------------------------------
  docker-build:
    name: Docker build (expected to fail — private dependency, see comments)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        working-directory: .
        run: docker build -f Dockerfile -t frekcore-backend:ci .
